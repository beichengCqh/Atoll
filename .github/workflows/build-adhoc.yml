name: Build Atoll (Ad Hoc)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-atoll-${{ github.ref }}
  cancel-in-progress: true
env:
  PROJECT: DynamicIsland.xcodeproj
  SCHEME: DynamicIsland
  APP_NAME: Atoll
  DERIVED_DATA: build/DerivedData
jobs:
  build:
    name: Build Atoll.app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run regression tests
        run: |
          python3 -m unittest \
            tests.test_privacy_configuration \
            tests.test_timer_lifecycle \
            tests.test_tool_converter \
            tests.test_tool_feature_configuration
      - name: Prepare ad-hoc entitlements
        run: |
          ENTITLEMENTS="$RUNNER_TEMP/Atoll.entitlements"
          cp DynamicIsland/DynamicIsland.entitlements "$ENTITLEMENTS"
          if ! plutil_output=$(plutil -remove com.apple.security.mach-services "$ENTITLEMENTS" 2>&1); then
            if printf '%s' "$plutil_output" | grep -q "No value to remove"; then
              echo "mach-services entitlement is already absent."
            else
              echo "::error::Failed to prepare entitlements: $plutil_output"
              exit 1
            fi
          fi
          echo "ENTITLEMENTS=$ENTITLEMENTS" >> "$GITHUB_ENV"
      - name: Prepare Xcode components
        run: |
          sudo xcodebuild -runFirstLaunch || true
          MACOS_MAJOR=$(sw_vers -productVersion | cut -d. -f1)
          if [ "$MACOS_MAJOR" -ge 26 ]; then
            downloaded=false
            for attempt in 1 2 3 4 5; do
              if sudo xcodebuild -downloadComponent MetalToolchain; then
                downloaded=true
                break
              fi
              sleep 10
            done
            if [ "$downloaded" = false ] && ! xcrun -f metal >/dev/null 2>&1; then
              echo "::error::Metal Toolchain is unavailable."
              exit 1
            fi
          fi
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"
      - name: Build Release app
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath build/BuildResults.xcresult \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES \
            CODE_SIGN_ENTITLEMENTS="$ENTITLEMENTS" \
            | tee build/xcodebuild.log
      - name: Verify app
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/Release/$APP_NAME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle was not found at $APP_PATH"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" \
            > build/Atoll-built.entitlements.plist
          plutil -p build/Atoll-built.entitlements.plist
          lipo -info "$APP_PATH/Contents/MacOS/$APP_NAME"
      - name: Package app
        id: package
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/Release/$APP_NAME.app"
          SHORT_SHA="${GITHUB_SHA::7}"
          ZIP_PATH="build/${APP_NAME}-${SHORT_SHA}-adhoc.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
      - name: Upload Atoll artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atoll-${{ github.ref_name }}-${{ github.run_number }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Atoll-build-diagnostics-${{ github.run_number }}
          path: |
            build/xcodebuild.log
            build/BuildResults.xcresult
            build/Atoll-built.entitlements.plist
          if-no-files-found: ignore
          retention-days: 7
